name: Luma ERP tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start Frappe stack
        run: docker compose -f deployment/docker-compose.yml up -d

      - name: Wait for Luma site
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f deployment/docker-compose.yml exec -T backend \
              bench --site frontend list-apps >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          docker compose -f deployment/docker-compose.yml ps
          exit 1

      - name: Run Luma ERP tests
        run: docker compose -f deployment/docker-compose.yml exec -T backend bench --site frontend run-tests --app luma_erp

      - name: Collect container logs on failure
        if: failure()
        run: docker compose -f deployment/docker-compose.yml logs --no-color

      - name: Stop Frappe stack
        if: always()
        run: docker compose -f deployment/docker-compose.yml down -v
